<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Alumno guardado</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4">
		<h1 class="mb-4">Alumno guardado correctamente</h1>

		<dl class="row">
			<dt class="col-sm-2">ID</dt>
			<dd class="col-sm-10" data-test="alumno-id" th:text="${alumno.id}"></dd>

			<dt class="col-sm-2">DNI</dt>
			<dd class="col-sm-10" data-test="alumno-dni" th:text="${alumno.dni}"></dd>

			<dt class="col-sm-2">Nombre</dt>
			<dd class="col-sm-10" data-test="alumno-nombre" th:text="${alumno.nombre}"></dd>

			<dt class="col-sm-2">Apellidos</dt>
			<dd class="col-sm-10" data-test="alumno-apellidos" th:text="${alumno.apellidos}"></dd>
		</dl>

		<a class="btn btn-primary" data-test="aceptar" th:href="@{/alumnos}">Aceptar</a>
	</div>
</body>
</html>
