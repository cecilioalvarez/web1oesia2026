<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Listado de alumnos</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div th:replace="~{fragments/menu :: menu}"></div>
	<div class="container py-4">
		<h1 class="mb-4">Alumnos</h1>

		<div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>

		<table class="table table-striped table-bordered">
			<thead>
				<tr>
					<th>ID</th>
					<th>DNI</th>
					<th>Nombre</th>
					<th>Apellidos</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="alumno : ${alumnos}">
					<td th:text="${alumno.id}"></td>
					<td th:text="${alumno.dni}"></td>
					<td th:text="${alumno.nombre}"></td>
					<td th:text="${alumno.apellidos}"></td>
					<td class="d-flex gap-2">
						<a class="btn btn-info btn-sm" th:href="@{/alumnos/{id}/matriculas(id=${alumno.id})}">Ver matrículas</a>
						<a class="btn btn-success btn-sm" th:href="@{/alumnos/{id}/matriculas/nueva(id=${alumno.id})}">Matricular</a>
						<a class="btn btn-primary btn-sm" th:href="@{/alumnos/{id}/editar(id=${alumno.id})}">Editar</a>
						<form th:action="@{/alumnos/{id}/eliminar(id=${alumno.id})}" method="post"
							onsubmit="return confirm('¿Seguro que desea eliminar este alumno?');">
							<button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
						</form>
					</td>
				</tr>
				<tr th:if="${alumnos.isEmpty()}">
					<td colspan="5" class="text-center">No hay alumnos registrados</td>
				</tr>
			</tbody>
		</table>

		<a class="btn btn-primary" th:href="@{/alumnos/nuevo}">Nuevo alumno</a>
	</div>
</body>
</html>
