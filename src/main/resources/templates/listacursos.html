<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Listado de cursos</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div th:replace="~{fragments/menu :: menu}"></div>
	<div class="container py-4">
		<h1 class="mb-4">Cursos</h1>

		<div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>

		<form class="row g-2 mb-4" method="get" th:action="@{/cursos}">
			<div class="col-auto">
				<input type="text" class="form-control" name="titulo" placeholder="Buscar por título" th:value="${titulo}">
			</div>
			<div class="col-auto">
				<button type="submit" class="btn btn-secondary">Buscar</button>
			</div>
			<div class="col-auto" th:if="${titulo != null and !titulo.isBlank()}">
				<a class="btn btn-outline-secondary" th:href="@{/cursos}">Limpiar</a>
			</div>
		</form>

		<table class="table table-striped table-bordered">
			<thead>
				<tr>
					<th>ID</th>
					<th>Título</th>
					<th>Duración (horas)</th>
					<th>Descripción</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="curso : ${cursos}">
					<td th:text="${curso.id}"></td>
					<td th:text="${curso.titulo}"></td>
					<td th:text="${curso.duracion}"></td>
					<td th:text="${curso.descripcion}"></td>
					<td class="d-flex gap-2">
						<a class="btn btn-info btn-sm" th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}">Ver imparticiones</a>
						<a class="btn btn-success btn-sm" data-test="anadir-imparticion" th:href="@{/cursos/{id}/imparticiones/nueva(id=${curso.id})}">Añadir impartición</a>
						<form th:action="@{/cursos/{id}/eliminar(id=${curso.id})}" method="post" onsubmit="return confirm('¿Seguro que desea eliminar este curso?');">
							<button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>

		<a class="btn btn-primary" th:href="@{/cursos/nuevo}">Nuevo curso</a>
	</div>
</body>
</html>
