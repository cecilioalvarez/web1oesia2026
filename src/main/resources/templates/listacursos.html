<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Listado de cursos</title>
</head>
<body>
	<h1>Cursos</h1>
	<table border="1">
		<thead>
			<tr>
				<th>Título</th>
				<th>Duración (horas)</th>
				<th>Descripción</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="curso : ${cursos}">
				<td th:text="${curso.titulo}"></td>
				<td th:text="${curso.duracion}"></td>
				<td th:text="${curso.descripcion}"></td>
			</tr>
		</tbody>
	</table>
</body>
</html>
