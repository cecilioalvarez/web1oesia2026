<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Imparticiones del curso</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4">
		<h1 class="mb-4">Imparticiones de <span th:text="${curso.titulo}"></span> (ID: <span th:text="${curso.id}"></span>)</h1>

		<table class="table table-striped table-bordered">
			<thead>
				<tr>
					<th>ID</th>
					<th>Fecha de inicio</th>
					<th>Fecha de fin</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="imparticion : ${imparticiones}">
					<td th:text="${imparticion.id}"></td>
					<td th:text="${imparticion.fechaInicio}"></td>
					<td th:text="${imparticion.fechaFin}"></td>
				</tr>
				<tr th:if="${imparticiones.isEmpty()}">
					<td colspan="3" class="text-center">Este curso no tiene imparticiones registradas</td>
				</tr>
			</tbody>
		</table>

		<a class="btn btn-success" th:href="@{/cursos/{id}/imparticiones/nueva(id=${curso.id})}">Añadir impartición</a>
		<a class="btn btn-secondary" th:href="@{/cursos}">Volver al listado de cursos</a>
	</div>
</body>
</html>
