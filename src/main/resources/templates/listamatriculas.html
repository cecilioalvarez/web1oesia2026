<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Matrículas del alumno</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div th:replace="~{fragments/menu :: menu}"></div>
	<div class="container py-4">
		<h1 class="mb-4">Matrículas de <span th:text="${alumno.nombre} + ' ' + ${alumno.apellidos}"></span>
			(ID alumno: <span th:text="${alumno.id}"></span>)</h1>

		<table class="table table-striped table-bordered">
			<thead>
				<tr>
					<th>ID</th>
					<th>Fecha de matriculación</th>
					<th>Curso</th>
					<th>Fecha de inicio</th>
					<th>Fecha de fin</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="matricula : ${matriculas}">
					<td th:text="${matricula.id}"></td>
					<td th:text="${matricula.fecha}"></td>
					<td th:text="${matricula.imparticion.curso.titulo}"></td>
					<td th:text="${matricula.imparticion.fechaInicio}"></td>
					<td th:text="${matricula.imparticion.fechaFin}"></td>
				</tr>
				<tr th:if="${matriculas.isEmpty()}">
					<td colspan="5" class="text-center">Este alumno no tiene matrículas registradas</td>
				</tr>
			</tbody>
		</table>

		<a class="btn btn-success" th:href="@{/alumnos/{id}/matriculas/nueva(id=${alumno.id})}">Nueva matrícula</a>
		<a class="btn btn-secondary" th:href="@{/alumnos}">Volver al listado de alumnos</a>
	</div>
</body>
</html>
