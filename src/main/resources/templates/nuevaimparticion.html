<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Nueva impartición</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4">
		<h1 class="mb-4">Nueva impartición de <span th:text="${curso.titulo}"></span> (ID: <span th:text="${curso.id}"></span>)</h1>
		<form th:action="@{/cursos/{id}/imparticiones(id=${curso.id})}" th:object="${imparticion}" method="post"
			onsubmit="this.querySelector('button[type=submit]').disabled = true;">
			<div class="mb-3">
				<label class="form-label">Fecha de inicio</label>
				<input type="date" class="form-control" th:field="*{fechaInicio}"
					th:classappend="${#fields.hasErrors('fechaInicio')} ? ' is-invalid'" />
				<div class="invalid-feedback" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Fecha de fin</label>
				<input type="date" class="form-control" th:field="*{fechaFin}"
					th:classappend="${#fields.hasErrors('fechaFin')} ? ' is-invalid'" />
				<div class="invalid-feedback" th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"></div>
			</div>
			<button type="submit" class="btn btn-primary">Guardar</button>
			<a class="btn btn-secondary" th:href="@{/cursos}">Volver al listado</a>
		</form>
	</div>
</body>
</html>
