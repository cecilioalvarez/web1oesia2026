<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Nuevo alumno</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div th:replace="~{fragments/menu :: menu}"></div>
	<div class="container py-4">
		<h1 class="mb-4">Nuevo alumno</h1>
		<form th:action="@{/alumnos}" th:object="${alumno}" method="post"
			onsubmit="this.querySelector('button[type=submit]').disabled = true;">
			<div class="mb-3">
				<label class="form-label">DNI</label>
				<input type="text" class="form-control" th:field="*{dni}" data-test="dni"
					th:classappend="${#fields.hasErrors('dni')} ? ' is-invalid'" />
				<div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Nombre</label>
				<input type="text" class="form-control" th:field="*{nombre}" data-test="nombre"
					th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid'" />
				<div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Apellidos</label>
				<input type="text" class="form-control" th:field="*{apellidos}" data-test="apellidos"
					th:classappend="${#fields.hasErrors('apellidos')} ? ' is-invalid'" />
				<div class="invalid-feedback" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
			</div>
			<button type="submit" class="btn btn-primary" data-test="guardar">Guardar</button>
			<a class="btn btn-secondary" th:href="@{/alumnos}">Volver al listado</a>
		</form>
	</div>
</body>
</html>
