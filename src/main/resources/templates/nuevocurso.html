<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Nuevo curso</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div th:replace="~{fragments/menu :: menu}"></div>
	<div class="container py-4">
		<h1 class="mb-4">Nuevo curso</h1>
		<form th:action="@{/cursos}" th:object="${curso}" method="post"
			onsubmit="this.querySelector('button[type=submit]').disabled = true;">
			<div class="mb-3">
				<label class="form-label">Título</label>
				<input type="text" class="form-control" th:field="*{titulo}" />
			</div>
			<div class="mb-3">
				<label class="form-label">Duración (horas)</label>
				<input type="number" class="form-control" th:field="*{duracion}" min="0" max="200"
					th:classappend="${#fields.hasErrors('duracion')} ? ' is-invalid'" />
				<div class="invalid-feedback" th:if="${#fields.hasErrors('duracion')}" th:errors="*{duracion}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Descripción</label>
				<input type="text" class="form-control" th:field="*{descripcion}" />
			</div>
			<button type="submit" class="btn btn-primary">Guardar</button>
			<a class="btn btn-secondary" th:href="@{/cursos}">Volver al listado</a>
		</form>
	</div>
</body>
</html>
