<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Nuevo pago</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div th:replace="~{fragments/menu :: menu}"></div>
	<div class="container py-4">
		<h1 class="mb-4">Nuevo pago de la matrícula (ID: <span th:text="${matricula.id}"></span>)</h1>

		<form th:action="@{/matriculas/{id}/pago(id=${matricula.id})}" th:object="${pago}" method="post"
			onsubmit="this.querySelector('button[type=submit]').disabled = true;">
			<div class="mb-3">
				<label class="form-label">Fecha</label>
				<input type="date" class="form-control" th:field="*{fecha}" data-test="fecha"
					th:classappend="${#fields.hasErrors('fecha')} ? ' is-invalid'" />
				<div class="invalid-feedback" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Importe</label>
				<input type="number" step="0.01" class="form-control" th:field="*{importe}" data-test="importe"
					th:classappend="${#fields.hasErrors('importe')} ? ' is-invalid'" />
				<div class="invalid-feedback" th:if="${#fields.hasErrors('importe')}" th:errors="*{importe}"></div>
			</div>
			<button type="submit" class="btn btn-primary" data-test="guardar">Guardar</button>
			<a class="btn btn-secondary" th:href="@{/alumnos/{id}/matriculas(id=${matricula.alumno.id})}">Omitir</a>
		</form>
	</div>
</body>
</html>
