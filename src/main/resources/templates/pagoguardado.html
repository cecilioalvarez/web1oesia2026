<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Pago guardado</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div th:replace="~{fragments/menu :: menu}"></div>
	<div class="container py-4">
		<h1 class="mb-4">Pago guardado correctamente</h1>

		<dl class="row">
			<dt class="col-sm-2">ID</dt>
			<dd class="col-sm-10" data-test="pago-id" th:text="${pago.id}"></dd>

			<dt class="col-sm-2">Fecha</dt>
			<dd class="col-sm-10" data-test="pago-fecha" th:text="${pago.fecha}"></dd>

			<dt class="col-sm-2">Importe</dt>
			<dd class="col-sm-10" data-test="pago-importe" th:text="${pago.importe}"></dd>
		</dl>

		<a class="btn btn-primary" data-test="aceptar" th:href="@{/alumnos/{id}/matriculas(id=${pago.matricula.alumno.id})}">Aceptar</a>
	</div>
</body>
</html>
